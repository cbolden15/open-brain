name: CI

on:
  pull_request:
  push:
    branches: [main, goal/open-brain-five-minute-install]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Branch protection requires these two names. Each passes only when its platform's build
  # and every Python test shard passed.
  linux-x86-64:
    name: Linux x86_64
    if: always()
    needs: [linux-x86-64-build, linux-x86-64-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build and every test shard
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done

  macos-arm64:
    name: macOS arm64
    if: always()
    needs: [macos-arm64-build, macos-arm64-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build and every test shard
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done

  linux-x86-64-tests:
    name: Linux x86_64 tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select preinstalled Homebrew
        env:
          LINUXBREW_USER: linuxbrew
        run: echo "/home/${LINUXBREW_USER}/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Verify runner
        run: test "$(uname -m)" = x86_64 && brew --version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14.7"
          version: "0.12.8"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run Python test shard
        env:
          SHARD: ${{ matrix.shard }}/4
        run: make test-shard SHARD="$SHARD"

  macos-arm64-tests:
    name: macOS arm64 tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner
        run: test "$(uname -m)" = arm64 && brew --version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14.7"
          version: "0.12.8"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run Python test shard
        env:
          SHARD: ${{ matrix.shard }}/4
        run: make test-shard SHARD="$SHARD"

  linux-x86-64-build:
    name: Linux x86_64 build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select preinstalled Homebrew
        env:
          LINUXBREW_USER: linuxbrew
        run: echo "/home/${LINUXBREW_USER}/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Verify runner
        run: test "$(uname -m)" = x86_64 && brew --version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14.7"
          version: "0.12.8"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: make contributor-check-without-tests
      - name: Verify experimental Graphify native helper
        run: uv run --frozen --python 3.14 --no-dev --group native-build python -m tools.nw0_graphify_probe.run
      - name: Measure native base startup with separate helper
        run: uv run --frozen --python 3.14 --no-dev --group native-build python -m tools.nw0_graphify_probe.startup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nw0-graphify-linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/nw0-graphify/release
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-brain-linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/native/release
          if-no-files-found: error
          retention-days: 7

  macos-arm64-build:
    name: macOS arm64 build
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner
        run: test "$(uname -m)" = arm64 && brew --version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14.7"
          version: "0.12.8"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: make contributor-check-without-tests
      - name: Verify experimental Graphify native helper
        run: uv run --frozen --python 3.14 --no-dev --group native-build python -m tools.nw0_graphify_probe.run
      - name: Measure native base startup with separate helper
        run: uv run --frozen --python 3.14 --no-dev --group native-build python -m tools.nw0_graphify_probe.startup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nw0-graphify-macos-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/nw0-graphify/release
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-brain-macos-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/native/release
          if-no-files-found: error
          retention-days: 7

  nw0-api-proof:
    name: NW0 async API proof (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            machine: x86_64
          - runner: macos-latest
            target: macos-arm64
            machine: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.8"
          enable-cache: true
      - name: Verify isolated synthetic async transport
        run: uv run --frozen --python 3.14 python -m tools.nw0_api_probe.run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nw0-api-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/nw0-api/release/verification.json
          if-no-files-found: error
          retention-days: 7

  nw0-unprivileged-transport-proof:
    name: NW0 unprivileged transport proof (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            machine: x86_64
          - runner: macos-latest
            target: macos-arm64
            machine: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.8"
          enable-cache: true
      - name: Verify unprivileged synthetic resolver and TLS lifecycle
        run: uv run --frozen --python 3.14 python -m tools.nw0_unprivileged_transport_probe.run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nw0-unprivileged-transport-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/nw0-unprivileged-transport/release/verification.json
          if-no-files-found: error
          retention-days: 7
