name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev --package open-brain --extra secure-node
      - run: uv run ruff check .
      - run: uv run --package open-brain --extra secure-node mypy
      - run: uv run --package open-brain --extra secure-node pytest -q
      - run: make verify-artifacts

  appliance-source-checkout-macos:
    name: macOS source/wheel (Python 3.14)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev --package open-brain --extra secure-node
      - run: >
          uv run --package open-brain --extra secure-node pytest -q
          tests/phase4/test_app_distribution.py
          packages/app/tests/integration/services/test_appliance_upgrade.py
          packages/app/tests/integration/services/test_appliance_uninstall.py
          packages/app/tests/integration/services/test_appliance_supervisors.py
          packages/app/tests/integration/services/test_appliance_entrypoints.py
          tests/security/test_appliance_logs.py
          tests/security/test_public_result_residue.py

  phase4-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev --package open-brain --extra secure-node
      - run: make phase4-contracts

  open-brain-base-native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev --group native-build
      - run: make ob1w0-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-brain-base-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/ob1-w0-native/release
          if-no-files-found: error
          retention-days: 7

  open-brain-base-native-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev --group native-build
      - run: make ob1w0-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-brain-base-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/ob1-w0-native/release
          if-no-files-found: error
          retention-days: 7

  # Historical P4-W6 artifact replay stays pinned to Python 3.12. It is not a v0 runtime.
  p4w6-python-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev --group native-build --package open-brain --extra secure-node
      - run: >
          make p4w6-python
          P4W6_SOURCE_SHA=${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4w6-python-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/p4w6-python
          if-no-files-found: error
          retention-days: 7

  p4w6-linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev --group native-build --package open-brain --extra secure-node
      - run: make p4w6-focused
      - run: >
          make p4w6-linux
          P4W6_SOURCE_SHA=${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4w6-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/p4w6-linux/artifacts
            build/p4w6-linux/native-build/artifact-members.json
            build/p4w6-linux/native-build/build-evidence.json
          if-no-files-found: error
          retention-days: 7

  p4w6-linux-clean-host:
    needs: p4w6-linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        container-image: [ubuntu:24.04, ubuntu:26.04, debian:13]
    env:
      P4W6_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.8"
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: p4w6-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/p4w6-linux-download
      - run: uv sync --frozen --group dev
      - run: uv run python -m tools.phase4.clean_host_fixture --output build/p4w6-fixture
      - name: Run exact archive without repository or system Python
        run: |
          case "${{ matrix.container-image }}" in
            ubuntu:24.04) host=ubuntu-24.04 ;;
            ubuntu:26.04) host=ubuntu-26.04 ;;
            debian:13) host=debian-13 ;;
            *) exit 1 ;;
          esac
          mkdir -p build/p4w6-controller build/p4w6-host-evidence
          cp tools/phase4/clean_host_lifecycle.sh build/p4w6-controller/
          cp tools/phase4/supervisor_shim.sh build/p4w6-controller/
          cp tools/phase4/unix_request.pl build/p4w6-controller/
          docker run --rm --platform linux/amd64 \
            --env P4W6_HOST="$host" \
            --env P4W6_SOURCE_SHA="$P4W6_SOURCE_SHA" \
            --volume "$PWD/build/p4w6-controller:/controller:ro" \
            --volume "$PWD/build/p4w6-linux-download/artifacts:/artifact:ro" \
            --volume "$PWD/build/p4w6-fixture:/fixture:ro" \
            --volume "$PWD/build/p4w6-host-evidence:/evidence" \
            "${{ matrix.container-image }}" \
            sh -eu -c '
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl jq perl sqlite3 >/dev/null
              /controller/clean_host_lifecycle.sh \
                /artifact/open-brain-0.1.0-linux-x86_64.tar.gz \
                /artifact/open-brain-0.1.0-linux-x86_64.tar.gz.sha256 \
                /fixture \
                "/evidence/$P4W6_HOST.json" \
                "$P4W6_SOURCE_SHA" \
                "$P4W6_HOST" \
                x86_64 \
                false
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4w6-clean-host-${{ strategy.job-index }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/p4w6-host-evidence
          if-no-files-found: error
          retention-days: 7

  native-build-linux:
    needs: [p4w6-linux-build, p4w6-linux-clean-host]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: >
          test "${{ needs.p4w6-linux-build.result }}" = success &&
          test "${{ needs.p4w6-linux-clean-host.result }}" = success

  p4w6-macos-14-compatibility:
    name: macOS source/wheel compatibility
    needs: appliance-source-checkout-macos
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.appliance-source-checkout-macos.result }}" = success

  native-build-macos:
    name: macOS source/wheel
    needs: p4w6-macos-14-compatibility
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.p4w6-macos-14-compatibility.result }}" = success

  connector-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q tests/phase4/test_connector_distribution.py
