[dependency-groups]
dev = [
  "build>=1.6.0,<2",
  "jsonschema>=4.26.0,<5",
  "mypy>=2.3.1,<3",
  "open-brain==0.1.0",
  "open-brain-engine==0.1.0",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.6,<1",
]
native-build = [
  "open-brain==0.1.0",
  "pyinstaller==6.22.2",
  "pyinstaller-hooks-contrib==2026.7",
]

[tool.uv.workspace]
members = [
  "packages/app",
  "packages/connectors",
  "packages/engine",
]

[tool.uv.sources]
open-brain = { workspace = true }
open-brain-engine = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = [
  ".",
  "packages/app/src",
  "packages/connectors/src",
  "packages/engine/src",
]
testpaths = [
  "tests",
  "packages/app/tests",
  "packages/connectors/tests",
  "packages/engine/tests",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["open_brain", "open_brain_connectors", "tools"]
known-third-party = ["open_brain_engine"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = [
  "packages/app/src",
  "packages/connectors/src",
  "packages/engine/src",
]
files = ["packages", "tests", "tools"]
