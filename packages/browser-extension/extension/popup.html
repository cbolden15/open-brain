<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Save to Open Brain</title>
<link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body><main>
<h1>Save to Open Brain</h1>
<p id="status" role="status" aria-live="polite">Checking this page…</p>
<section id="preview" hidden>
<h2 id="title"></h2><p id="url"></p><blockquote id="passage"></blockquote>
<p>Destination · <strong id="destination"></strong></p>
<p id="existing" hidden>Already saved in this source. The original reason is retained.</p>
<form id="page-form"><label for="reason">Why save this page?</label>
<textarea id="reason" required maxlength="560" rows="3"></textarea>
<button type="submit" id="save">Save page</button></form>
<form id="highlight-form" hidden>
<label for="note">Highlight note (optional)</label>
<textarea id="note" rows="2" maxlength="2048"></textarea>
<button id="add-highlight" type="submit">Save highlight</button>
</form>
<section id="highlights" hidden aria-label="Saved highlights">
<button id="show-highlights" type="button">Show saved highlights</button>
<div id="highlight-list" hidden>
<ol id="quotes"></ol>
<button id="restore-highlights" type="button">Highlight these passages on the page</button>
<button id="previous-highlights" type="button">Previous highlights</button>
<button id="next-highlights" type="button">More highlights</button>
</div>
</section>
</section>
<section id="pending" hidden><h2>Unresolved saves</h2><ul></ul></section>
</main></body></html>
