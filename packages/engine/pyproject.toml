[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-brain-engine"
version = "0.1.0"
description = "Local-first Open Brain domain engine and Portable Brain contracts."
# The lower bound preserves frozen P4 replay; the supported v0 runtime is Python 3.14.
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Open Brain contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["rfc8785>=0.1.4,<0.2"]

[project.optional-dependencies]
secure-node = [
  "argon2-cffi>=25.1,<26",
  "cryptography>=50,<51",
  "keyring>=25.6,<26",
  "pyobjc-framework-LocalAuthentication>=12,<13; sys_platform == 'darwin'",
  "sqlcipher3==0.6.2",
]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src/open_brain_engine",
]
exclude = ["/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
"../../release/phase4-compatibility.json" = "release/phase4-compatibility.json"
"../../release/phase4-toolchain.json" = "release/phase4-toolchain.json"
"../../release/m1-compatibility-receipts.json" = "release/m1-compatibility-receipts.json"
"../../release/m1-compatibility.json" = "release/m1-compatibility.json"
"../../release/public-history-allowlist.json" = "release/public-history-allowlist.json"
"../../release/v0-artifact-policy.json" = "release/v0-artifact-policy.json"

[tool.hatch.build.targets.wheel]
packages = ["src/open_brain_engine"]
