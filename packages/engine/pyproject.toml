[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-brain-engine"
version = "0.1.0"
description = "Local-first Open Brain domain engine and Portable Brain contracts."
# The lower bound preserves frozen P4 replay; the supported v0 runtime is Python 3.14.
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Open Brain contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["rfc8785>=0.1.4,<0.2"]

[project.urls]
Homepage = "https://github.com/cbolden15/open-brain"
Repository = "https://github.com/cbolden15/open-brain"
Documentation = "https://github.com/cbolden15/open-brain/blob/main/README.md"
Issues = "https://github.com/cbolden15/open-brain/issues"
Changelog = "https://github.com/cbolden15/open-brain/blob/main/CHANGELOG.md"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src/open_brain_engine",
]
exclude = ["/.gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_brain_engine"]
