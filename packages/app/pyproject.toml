[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-brain"
version = "0.1.0"
description = "Local-first Open Brain application."
# The lower bound preserves frozen P4 replay; the supported v0 runtime is Python 3.14.
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Open Brain contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "open-brain-engine[node]==0.1.0",
  "starlette>=0.48,<1",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
cloud = ["openai>=1.99,<3"]
integrations = []
mcp = []

[project.scripts]
open-brain = "open_brain.services.appliance_entrypoints:run_cli"
open-brain-mcp = "open_brain.services.appliance_entrypoints:run_mcp"

[tool.uv.sources]
open-brain-engine = { workspace = true }

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src/open_brain",
]
exclude = ["/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
"../../README.md" = "README.md"
