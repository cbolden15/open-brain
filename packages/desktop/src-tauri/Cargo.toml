[package]
name = "open-brain-desktop"
version = "0.1.0"
description = "Native Open Brain desktop companion proof"
authors = ["Open Brain contributors"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[lib]
name = "open_brain_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "=2.11.5", features = [] }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
