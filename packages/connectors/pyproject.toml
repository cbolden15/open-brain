[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-brain-connectors"
version = "0.1.0"
description = "Provisional isolated connector runtime for Open Brain."
# The lower bound preserves frozen P4 replay; the supported v0 runtime is Python 3.14.
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Open Brain contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "open-brain-engine==0.1.0",
]

[project.urls]
Homepage = "https://github.com/cbolden15/open-brain"
Repository = "https://github.com/cbolden15/open-brain"
Documentation = "https://github.com/cbolden15/open-brain/blob/main/README.md"
Issues = "https://github.com/cbolden15/open-brain/issues"
Changelog = "https://github.com/cbolden15/open-brain/blob/main/CHANGELOG.md"

[project.entry-points."open_brain.connectors.v1"]
youtube = "open_brain_connectors.conformance:connector"

[tool.uv.sources]
open-brain-engine = { workspace = true }

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src/open_brain_connectors",
]
exclude = ["/.gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_brain_connectors"]
